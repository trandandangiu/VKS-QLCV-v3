<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f448e" />
      <stop offset="45%" stop-color="#09316d" />
      <stop offset="85%" stop-color="#041b42" />
      <stop offset="100%" stop-color="#020e24" />
    </radialGradient>

    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0.1"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <pattern id="dots" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255, 255, 255, 0.07)"/>
    </pattern>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Deep Navy Base Gradient -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Lines -->
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="380" cy="520" r="380" fill="#1e60be" opacity="0.25" filter="url(#blur-glow)"/>
  <circle cx="1500" cy="400" r="300" fill="#0d47a1" opacity="0.3" filter="url(#blur-glow)"/>
  <circle cx="960" cy="900" r="450" fill="#0a3875" opacity="0.35" filter="url(#blur-glow)"/>

  <!-- World Map Stylized Silhouette -->
  <g fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2">
    <!-- North America -->
    <path d="M 220 220 Q 300 210 380 260 Q 420 320 380 400 Q 300 450 250 420 Q 180 340 220 220 Z"/>
    <path d="M 180 260 Q 230 250 260 300 Q 240 360 190 350 Z"/>
    <!-- South America -->
    <path d="M 390 480 Q 460 520 480 620 Q 460 750 400 820 Q 360 740 370 600 Z"/>
    <!-- Europe -->
    <path d="M 850 220 Q 960 210 1000 280 Q 970 360 880 370 Q 820 320 850 220 Z"/>
    <path d="M 800 240 Q 840 230 850 280 Q 810 310 780 270 Z"/>
    <!-- Africa -->
    <path d="M 840 400 Q 980 410 1010 520 Q 980 700 900 780 Q 820 660 810 520 Z"/>
    <!-- Asia -->
    <path d="M 1040 210 Q 1300 180 1480 260 Q 1550 400 1420 520 Q 1200 500 1060 380 Z"/>
    <!-- Southeast Asia & Vietnam -->
    <path d="M 1320 460 Q 1380 480 1410 560 Q 1360 620 1310 540 Z"/>
    <path d="M 1340 500 Q 1370 520 1360 570 Q 1330 550 1340 500 Z" fill="rgba(255, 213, 79, 0.15)" stroke="rgba(255, 213, 79, 0.3)"/>
    <!-- Australia -->
    <path d="M 1440 680 Q 1580 670 1620 760 Q 1560 860 1460 840 Q 1400 770 1440 680 Z"/>
  </g>

  <!-- Network Constellation Lines & Interconnected Nodes -->
  <g stroke="rgba(100, 181, 246, 0.28)" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="280" y1="320" x2="390" y2="280"/>
    <line x1="390" y1="280" x2="880" y2="260"/>
    <line x1="880" y1="260" x2="1160" y2="280"/>
    <line x1="1160" y1="280" x2="1360" y2="480"/>
    <line x1="1360" y1="480" x2="1520" y2="720"/>
    <line x1="420" y1="580" x2="860" y2="480"/>
    <line x1="860" y1="480" x2="1360" y2="480"/>
    <line x1="380" y1="280" x2="420" y2="580"/>
    <line x1="880" y1="260" x2="920" y2="580"/>
    <line x1="1160" y1="280" x2="1480" y2="340"/>
    <line x1="1480" y1="340" x2="1360" y2="480"/>
    <line x1="920" y1="580" x2="1360" y2="480"/>
  </g>

  <!-- High-Tech Nodes (Glowing Points) -->
  <g>
    <!-- Node 1: Hanoi / HCMC Vietnam (Highlighted Golden Node) -->
    <circle cx="1360" cy="510" r="16" fill="rgba(255, 213, 79, 0.15)"/>
    <circle cx="1360" cy="510" r="8" fill="rgba(255, 213, 79, 0.4)"/>
    <circle cx="1360" cy="510" r="4" fill="#ffd54f"/>

    <!-- Other Global Nodes -->
    <circle cx="390" cy="280" r="4" fill="#64b5f6" opacity="0.8"/>
    <circle cx="280" cy="320" r="3" fill="#90caf9" opacity="0.7"/>
    <circle cx="420" cy="580" r="3.5" fill="#64b5f6" opacity="0.7"/>
    <circle cx="880" cy="260" r="4.5" fill="#90caf9" opacity="0.9"/>
    <circle cx="860" cy="480" r="3" fill="#64b5f6" opacity="0.7"/>
    <circle cx="920" cy="580" r="3.5" fill="#64b5f6" opacity="0.6"/>
    <circle cx="1160" cy="280" r="4" fill="#90caf9" opacity="0.8"/>
    <circle cx="1480" cy="340" r="3.5" fill="#64b5f6" opacity="0.7"/>
    <circle cx="1520" cy="720" r="4" fill="#90caf9" opacity="0.7"/>
  </g>

  <!-- High Tech Arcs -->
  <path d="M 390 280 Q 880 100 1360 510" fill="none" stroke="rgba(144, 202, 249, 0.22)" stroke-width="1.8"/>
  <path d="M 880 260 Q 1120 360 1360 510" fill="none" stroke="rgba(255, 213, 79, 0.25)" stroke-width="1.8"/>
  <path d="M 420 580 Q 900 640 1360 510" fill="none" stroke="rgba(144, 202, 249, 0.18)" stroke-width="1.5"/>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="80" opacity="0.4"/>
</svg>
